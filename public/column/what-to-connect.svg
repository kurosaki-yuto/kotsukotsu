<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title>こつこつに何を繋ぐと「現状」が書けるか</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffffff"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#1d3b9e"/>
  <circle cx="1080" cy="80" r="220" fill="#2c4cb5"/>
  <circle cx="1150" cy="600" r="160" fill="#25439f"/>

  <text x="70" y="96" font-size="24" font-weight="700" fill="#c9d4f5">こつこつ コラム</text>
  <text x="70" y="186" font-size="56" font-weight="700" fill="#ffffff">こつこつに何を繋ぐと</text>
  <text x="70" y="262" font-size="56" font-weight="700" fill="#ffffff">「現状」が書けるか</text>
  <text x="70" y="318" font-size="24" fill="#dbe3fb">繋ぐのは AI の側だけ。AI が読んで、こつこつに書く。</text>

  <!-- mini map -->
  <g font-size="22" font-weight="700">
    <g fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.5">
      <rect x="70" y="390" width="170" height="52" rx="12"/>
      <rect x="70" y="454" width="170" height="52" rx="12"/>
      <rect x="70" y="518" width="170" height="52" rx="12"/>
    </g>
    <g fill="#ffffff" text-anchor="middle">
      <text x="155" y="424">Chatwork</text>
      <text x="155" y="488">Gmail</text>
      <text x="155" y="552">カレンダー</text>
    </g>
    <line x1="252" y1="480" x2="372" y2="480" stroke="#ffffff" stroke-width="4" marker-end="url(#a)"/>
    <text x="312" y="464" text-anchor="middle" font-size="18" fill="#c9d4f5">読む</text>
    <rect x="380" y="420" width="190" height="120" rx="18" fill="#ffffff"/>
    <text x="475" y="490" text-anchor="middle" font-size="40" fill="#1d3b9e">AI</text>
    <line x1="582" y1="480" x2="702" y2="480" stroke="#ffffff" stroke-width="4" marker-end="url(#a)"/>
    <text x="642" y="464" text-anchor="middle" font-size="18" fill="#c9d4f5">書く</text>
    <rect x="710" y="420" width="230" height="120" rx="18" fill="#0f1f5c"/>
    <text x="825" y="474" text-anchor="middle" font-size="32" fill="#ffffff">こつこつ</text>
    <text x="825" y="512" text-anchor="middle" font-size="18" font-weight="400" fill="#c9d4f5">現状・タスク</text>
  </g>
</svg>

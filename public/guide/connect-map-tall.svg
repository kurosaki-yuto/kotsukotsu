<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" width="420" height="900" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title>こつこつ・AI・各ツールの繋がり</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1d3b9e"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#17864a"/>
    </marker>
  </defs>
  <rect width="420" height="900" rx="18" fill="#ffffff"/>

  <!-- 連携先 -->
  <rect x="20" y="20" width="380" height="300" rx="14" fill="none" stroke="#dce2ee" stroke-width="1.5"/>
  <g font-size="16" fill="#18233d">
    <text x="38" y="52" font-size="14" font-weight="700" fill="#60697b">連絡 — ボールが分かる</text>
    <rect x="38" y="62" width="168" height="38" rx="9" fill="#fff" stroke="#dce2ee"/><text x="122" y="87" text-anchor="middle">Chatwork</text>
    <rect x="214" y="62" width="168" height="38" rx="9" fill="#fff" stroke="#dce2ee"/><text x="298" y="87" text-anchor="middle">Gmail</text>

    <text x="38" y="130" font-size="14" font-weight="700" fill="#60697b">予定・資料</text>
    <rect x="38" y="140" width="168" height="38" rx="9" fill="#fff" stroke="#dce2ee"/><text x="122" y="165" text-anchor="middle">カレンダー</text>
    <rect x="214" y="140" width="168" height="38" rx="9" fill="#fff" stroke="#dce2ee"/><text x="298" y="165" text-anchor="middle">ドライブ</text>
    <rect x="38" y="186" width="168" height="38" rx="9" fill="#fff" stroke="#dce2ee"/><text x="122" y="211" text-anchor="middle">スプレッドシート</text>
    <rect x="214" y="186" width="168" height="38" rx="9" fill="#fff" stroke="#dce2ee"/><text x="298" y="211" text-anchor="middle">Notion</text>

    <text x="38" y="254" font-size="14" font-weight="700" fill="#60697b">開発 / 議事録</text>
    <rect x="38" y="264" width="168" height="38" rx="9" fill="#fff" stroke="#dce2ee"/><text x="122" y="289" text-anchor="middle">GitHub</text>
    <rect x="214" y="264" width="168" height="38" rx="9" fill="#fff" stroke="#dce2ee"/><text x="298" y="289" text-anchor="middle">Zoom</text>
  </g>

  <!-- 読む -->
  <line x1="210" y1="324" x2="210" y2="384" stroke="#17864a" stroke-width="3" marker-end="url(#ahg)"/>
  <text x="226" y="352" font-size="16" font-weight="700" fill="#17864a">① 読む</text>
  <text x="226" y="372" font-size="12.5" fill="#60697b">コネクタ / MCP</text>

  <!-- AI -->
  <rect x="20" y="388" width="380" height="170" rx="16" fill="#eef3ff" stroke="#1d3b9e" stroke-width="2"/>
  <text x="210" y="428" text-anchor="middle" font-size="26" font-weight="700" fill="#18233d">AI</text>
  <text x="210" y="452" text-anchor="middle" font-size="14" fill="#60697b">ここに全部を繋ぐ</text>
  <g font-size="15" fill="#18233d">
    <rect x="40" y="470" width="108" height="34" rx="8" fill="#fff" stroke="#c9d4f5"/><text x="94" y="493" text-anchor="middle">Claude</text>
    <rect x="156" y="470" width="124" height="34" rx="8" fill="#fff" stroke="#c9d4f5"/><text x="218" y="493" text-anchor="middle">Claude Code</text>
    <rect x="288" y="470" width="92" height="34" rx="8" fill="#fff" stroke="#c9d4f5"/><text x="334" y="493" text-anchor="middle">Codex</text>
  </g>
  <text x="210" y="536" text-anchor="middle" font-size="13" fill="#60697b">こつこつ の「AIで進める」から指示文入りで開ける</text>

  <!-- 書く -->
  <line x1="210" y1="562" x2="210" y2="622" stroke="#1d3b9e" stroke-width="3" marker-end="url(#ah)"/>
  <text x="226" y="598" font-size="16" font-weight="700" fill="#1d3b9e">② 書く</text>

  <!-- こつこつ -->
  <rect x="20" y="626" width="380" height="170" rx="16" fill="#1d3b9e"/>
  <text x="210" y="666" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">こつこつ</text>
  <g font-size="15" fill="#fff">
    <rect x="40" y="690" width="340" height="32" rx="8" fill="#2c4cb5"/><text x="210" y="712" text-anchor="middle">ゴール・タスク・完了の基準</text>
    <rect x="40" y="730" width="340" height="32" rx="8" fill="#2c4cb5"/><text x="210" y="752" text-anchor="middle">現状（ボール・詰まり）</text>
  </g>

  <text x="210" y="834" text-anchor="middle" font-size="15" font-weight="700" fill="#18233d">繋ぐのは AI の側だけ。</text>
  <text x="210" y="860" text-anchor="middle" font-size="14" fill="#60697b">こつこつ と各ツールは直接は繋がない。</text>
</svg>
